# 운영 구성 (EC2 1대) — CI 가 GHCR 에 올린 이미지를 받아 실행한다. 빌드는 하지 않음.
#   서버: /opt/game-admin/{docker-compose.prod.yml, deploy.sh, .env, docker/nginx, docker/mysql}
#   실행: IMAGE_PREFIX=ghcr.io/<owner>/<repo> IMAGE_TAG=<커밋> docker compose -f docker-compose.prod.yml up -d
# DB·Redis·API·MCP 는 외부에 포트를 열지 않는다. 밖에서 들어오는 길은 Nginx(80·443) 하나.
name: game-admin

x-app: &app
  restart: unless-stopped
  env_file: .env
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

services:
  mysql:
    <<: *app
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set in .env}
      MYSQL_USER: ${MYSQL_USER:?set in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    mem_limit: 512m
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  redis:
    <<: *app
    image: redis:7.4-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redis-data:/data
    mem_limit: 96m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    image: ${IMAGE_PREFIX:?}/api:${IMAGE_TAG:?}
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: 'ga:prod:'
      CORS_ORIGINS: https://${DOMAIN:?set in .env}
      ASSET_STORAGE_DIR: /app/storage/uploads
      NODE_OPTIONS: --max-old-space-size=256
    volumes:
      - uploads:/app/storage/uploads
    mem_limit: 384m
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  worker:
    <<: *app
    image: ${IMAGE_PREFIX:?}/worker:${IMAGE_TAG:?}
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: 'ga:prod:'
      ASSET_STORAGE_DIR: /app/storage/uploads
      NODE_OPTIONS: --max-old-space-size=192
    # 체험 서버 매일 초기화 때 업로드 파일도 지우므로 같은 볼륨을 붙인다
    volumes:
      - uploads:/app/storage/uploads
    mem_limit: 256m
    depends_on:
      api: { condition: service_healthy }

  # MCP: DB·Redis 정보 없이 API 만 호출 → .env 를 넘기지 않는다
  mcp:
    image: ${IMAGE_PREFIX:?}/mcp:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      GAME_ADMIN_API_URL: http://api:4000
      MCP_HOST: 0.0.0.0
      MCP_PORT: 4100
      MCP_ALLOWED_HOSTS: ${DOMAIN:?set in .env}
      NODE_OPTIONS: --max-old-space-size=128
    mem_limit: 160m
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    depends_on:
      api: { condition: service_healthy }

  # 웹(정적 파일) + 리버스 프록시 + TLS. 인증서는 6시간마다 다시 읽음(갱신 반영)
  web:
    image: ${IMAGE_PREFIX:?}/web:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    command:
      [
        '/bin/sh',
        '-c',
        'while :; do sleep 6h; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g "daemon off;"',
      ]
    mem_limit: 64m
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    depends_on:
      api: { condition: service_healthy }
      mcp: { condition: service_started }

  # Let's Encrypt 갱신 (12시간마다 확인, 만료 30일 전부터 갱신)
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done',
      ]
    mem_limit: 64m

volumes:
  mysql-data:
  redis-data:
  uploads:
  letsencrypt:
  certbot-www:
